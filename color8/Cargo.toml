[package]
name = "color8"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Orhan Balci <orhanbalci@gmail.com>"]
description = "Rust port of FastLED colorutils — CRGB/CHSV pixel types, HSV/RGB conversion, blending and gradients for embedded LED programming"
documentation = "https://docs.rs/color8"
homepage = "https://github.com/orhanbalci/color8"
repository = "https://github.com/orhanbalci/color8"
license = "MIT"
keywords = ["led", "embedded", "no-std", "color", "fastled"]
categories = ["embedded", "no-std", "graphics"]
readme = "README.md"
exclude = ["/tests", "/examples"]

[dependencies]
lib8tion = "0.1.1"

[dev-dependencies]
fastled-ref = { path = "../fastled-ref" }
lib8tion = "0.1.1"
proptest = "1.11.0"
image = { version = "0.25", default-features = false, features = ["png"] }

[package.metadata.docs.rs]
targets = ["thumbv7em-none-eabihf", "riscv32imc-unknown-none-elf"]
